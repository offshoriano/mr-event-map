<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel · MR Group</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root{--deep:#0D1117;--card:#111820;--card2:#141D27;--border:#1C2733;--border2:#243040;--gold:#C9933A;--gold-l:#E8B86D;--white:#EEE9E2;--muted:#7A8FA6;--muted2:#A0B2C4;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--deep);color:var(--white);}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px;}
h1{font-weight:800;font-size:26px;}
h1 span{color:var(--gold);}
.sub{color:var(--muted2);font-size:14px;margin-top:6px;}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:28px;}
.login h1{font-size:20px;margin-bottom:16px;}
input,select{font-family:inherit;font-size:14px;background:var(--card2);color:var(--white);border:1px solid var(--border2);border-radius:3px;padding:11px 12px;width:100%;}
.btn{font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 20px;border-radius:3px;border:none;cursor:pointer;background:var(--gold);color:#090C10;}
.btn.ghost{background:transparent;color:var(--muted2);border:1px solid var(--border2);}
.err{color:#ef7a7a;font-size:13px;margin-top:10px;min-height:18px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:16px;}
.kpi b{display:block;font-size:30px;font-weight:800;}
.kpi span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.bar input{max-width:280px;}
.bar select{max-width:220px;}
.bar .btn{margin-left:auto;}
.tbl{overflow:auto;border:1px solid var(--border);border-radius:3px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--card2);text-align:left;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:10px 12px;white-space:nowrap;}
td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;}
td.m{color:var(--muted2);}
.tag{font-size:11px;padding:3px 8px;border-radius:3px;white-space:nowrap;}
.tag.sim{background:rgba(12,163,12,.15);color:#7fdc7f;}
.tag.nao{background:rgba(201,147,58,.15);color:var(--gold-l);}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;}
.del:hover{color:#ef7a7a;}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr;}.bar .btn{margin-left:0;}}
.tabs{display:flex;gap:6px;margin:22px 0 4px;border-bottom:1px solid var(--border);}
.tab{font-family:inherit;font-weight:700;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted2);padding:10px 14px;cursor:pointer;}
.tab.on{color:var(--white);border-color:var(--gold);}
.badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:#E5484D;color:#fff;font-size:11px;text-align:center;}
.aviso{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:16px;margin:20px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.aviso p{flex:1 1 100%;font-size:13px;color:var(--muted2);line-height:1.6;}
.aviso input{max-width:320px;}
h2.sec{font-size:15px;font-weight:800;margin:26px 0 10px;}
.vg{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:18px;margin-bottom:12px;}
.vg.pend{border-color:rgba(201,147,58,.45);}
.vg-meta{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.vg-meta b{color:var(--muted2);}
.vg .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.vg label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.vg textarea{font-family:inherit;font-size:14px;background:var(--card2);color:var(--white);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;width:100%;min-height:140px;line-height:1.55;}
.vg-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.vg-line{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.vg-line a{color:var(--gold-l);}
.ov{position:fixed;inset:0;background:rgba(5,8,11,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.md{background:var(--card);border:1px solid var(--border2);border-radius:4px;max-width:420px;width:100%;padding:26px;}
.md h3{font-size:20px;font-weight:800;margin-bottom:8px;}
.md p{color:var(--muted2);font-size:14px;line-height:1.6;margin-bottom:16px;}
.md .btn{width:100%;margin-top:8px;}
@media(max-width:700px){.vg .g{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '../api/leads.php';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
let senha = '', LEADS = [];
try { senha = sessionStorage.getItem('mr-leads') || ''; } catch (e) {}

const post = body => fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
  .then(async r => ({ok:r.ok, data:await r.json().catch(() => ({}))}));

function login(msg){
  $('#app').innerHTML = `<form class="login" id="f"><h1>Contatos das vagas</h1>
    <input type="password" id="pw" placeholder="Senha" autofocus><div class="err">${esc(msg || '')}</div>
    <button class="btn" style="width:100%;margin-top:8px">Entrar</button></form>`;
  $('#f').onsubmit = e => { e.preventDefault(); senha = $('#pw').value; carregar(); };
}

let VG = [], AVISO = '', aba = ({'#vagas':'vagas', '#ranking':'ranking', '#empresas':'empresas', '#diagnosticos':'diagnosticos', '#mensagens':'mensagens', '#alertas':'alertas', '#curriculo':'curriculo', '#pagamentos':'pagamentos'})[location.hash] || 'contatos', avisou = false;
const AREAS = {seguranca:'Segurança', eletrica:'Elétrica e instrumentação', mecanica:'Mecânica e manutenção', pocos:'Perfuração e poços',
  maritimo:'Marítimo', hotelaria:'Hotelaria', operacao:'Operação e produção', engenharia:'Engenharia', trainee:'Trainee e estágio', geral:'Outras'};
const VAPI = '../api/vagas-enviadas.php';
const vpost = body => fetch(VAPI, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
  .then(async r => ({ok:r.ok, data:await r.json().catch(() => ({}))}));
const pendentes = () => VG.filter(v => v.status === 'pendente');

function carregar(){
  Promise.all([post({action:'list', senha}), vpost({action:'listar', senha})]).then(([l, v]) => {
    if (!l.ok){ try { sessionStorage.removeItem('mr-leads'); } catch (e) {} return login(l.data.error || 'Erro ao carregar'); }
    try { sessionStorage.setItem('mr-leads', senha); } catch (e) {}
    LEADS = l.data.leads || [];
    VG = v.ok ? (v.data.vagas || []) : []; AVISO = v.ok ? (v.data.aviso || '') : '';
    const n = pendentes().length;
    document.title = (n ? `(${n}) ` : '') + 'Painel · MR Group';
    painel();
    // Ao entrar, avisa uma vez se tem vaga esperando aprovação
    if (n && !avisou && aba !== 'vagas'){
      avisou = true;
      document.body.insertAdjacentHTML('beforeend', `<div class="ov" id="ov"><div class="md">
        <h3>${n} vaga${n > 1 ? 's' : ''} esperando aprovação</h3>
        <p>Empresas enviaram vaga pelo site. Elas só aparecem em /vagas depois que você aprovar.</p>
        <button class="btn" id="ov-ir">Revisar agora</button><button class="btn ghost" id="ov-x">Depois</button></div></div>`);
      $('#ov-ir').onclick = () => { $('#ov').remove(); aba = 'vagas'; painel(); };
      $('#ov-x').onclick = () => $('#ov').remove();
    }
  }).catch(() => login('Sem conexão com o servidor'));
}

function painel(){
  const n = pendentes().length;
  $('#app').innerHTML = `<div class="wrap">
    <h1>Painel <span>MR</span></h1>
    <div class="tabs">
      <button class="tab ${aba === 'contatos' ? 'on' : ''}" data-aba="contatos">Contatos</button>
      <button class="tab ${aba === 'vagas' ? 'on' : ''}" data-aba="vagas">Vagas enviadas${n ? `<span class="badge">${n}</span>` : ''}</button>
      <button class="tab ${aba === 'ranking' ? 'on' : ''}" data-aba="ranking">Ranking de cliques</button>
      <button class="tab ${aba === 'empresas' ? 'on' : ''}" data-aba="empresas">Empresas</button>
      <button class="tab ${aba === 'diagnosticos' ? 'on' : ''}" data-aba="diagnosticos">Diagnósticos</button>
      <button class="tab ${aba === 'mensagens' ? 'on' : ''}" data-aba="mensagens">Mensagens</button>
      <button class="tab ${aba === 'alertas' ? 'on' : ''}" data-aba="alertas">Alertas de vagas</button>
      <button class="tab ${aba === 'curriculo' ? 'on' : ''}" data-aba="curriculo">Currículo</button>
      <button class="tab ${aba === 'pagamentos' ? 'on' : ''}" data-aba="pagamentos">Pagamentos</button>
    </div>
    <div id="conteudo"></div></div>`;
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { aba = t.dataset.aba; history.replaceState(null, '', aba === 'contatos' ? '#' : '#' + aba); painel(); });
  aba === 'pagamentos' ? painelPagamentos() : aba === 'curriculo' ? painelCurriculo() : aba === 'alertas' ? painelAlertas() : aba === 'mensagens' ? painelMensagens() : aba === 'diagnosticos' ? painelDiagnosticos() : aba === 'vagas' ? painelVagas() : aba === 'ranking' ? painelRanking() : aba === 'empresas' ? painelEmpresas() : painelContatos();
}

function painelVagas(){
  const pend = pendentes(), pub = VG.filter(v => v.status === 'aprovada'), rec = VG.filter(v => v.status === 'recusada');
  const hoje = new Date().toISOString().slice(0, 10);
  const optAreas = sel => Object.entries(AREAS).map(([k, n]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${n}</option>`).join('');
  const quando = d => new Date(d).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
  $('#conteudo').innerHTML = `
    <div class="aviso">
      <p>${AVISO ? `Quando chega vaga nova, o aviso vai para <b>${esc(AVISO)}</b>.` : '<b>Coloque seu e-mail aqui</b> para receber um aviso toda vez que uma empresa enviar vaga.'} Se não aparecer na caixa de entrada, olhe no spam e marque como "não é spam".</p>
      <input type="email" id="av" placeholder="seu@email.com" value="${esc(AVISO)}">
      <button class="btn" id="av-s">Salvar e mandar teste</button><span id="av-m" class="note" style="margin:0"></span>
    </div>
    <p class="note" style="margin:0 0 6px">Link para mandar a empresas: <a href="../vagas/divulgar/" target="_blank" style="color:var(--gold-l)">mrgroup.com.br/vagas/divulgar</a></p>
    <h2 class="sec">Esperando aprovação (${pend.length})</h2>
    ${pend.length ? pend.map(v => `<div class="vg pend" data-id="${esc(v.id)}">
      <div class="vg-meta">Enviada em ${quando(v.enviada)} por <b>${esc(v.contato)}</b> · <a href="mailto:${esc(v.email)}" style="color:var(--gold-l)">${esc(v.email)}</a>${v.whatsapp ? ' · WhatsApp ' + esc(v.whatsapp) : ''}</div>
      <div class="g"><div><label>Cargo</label><input data-k="titulo" value="${esc(v.titulo)}"></div><div><label>Empresa</label><input data-k="empresa" value="${esc(v.empresa)}"></div></div>
      <div class="g"><div><label>Local</label><input data-k="local" value="${esc(v.local)}"></div>
        <div><label>Regime</label><select data-k="regime">${['Embarcado','Em terra','Híbrido'].map(r => `<option${r === v.regime ? ' selected' : ''}>${r}</option>`).join('')}</select></div></div>
      <div class="g"><div><label>Área (define os vídeos sugeridos)</label><select data-k="tema">${optAreas(v.tema || 'geral')}</select></div>
        <div><label>Inscrições até</label><input type="date" data-k="inscricoesAte" value="${esc(v.inscricoesAte)}"></div></div>
      <div class="g"><div><label>Contrato</label><input data-k="contrato" value="${esc(v.contrato)}"></div>
        <div><label>Link ou e-mail para candidatura</label><input data-k="link" value="${esc(v.link.replace(/^mailto:/, ''))}"></div></div>
      <label>Descrição</label><textarea data-k="descricao">${esc(v.descricao)}</textarea>
      <div class="vg-acts"><button class="btn" data-acao="aprovar">Aprovar e publicar</button><button class="btn ghost" data-acao="recusar">Recusar</button>
        <a class="btn ghost" href="${esc(v.link)}" target="_blank" rel="noopener" style="text-decoration:none">Testar link</a></div>
    </div>`).join('') : '<p class="note">Nenhuma vaga esperando. Quando chegar, aparece aqui e você recebe o aviso.</p>'}
    <h2 class="sec">Publicadas (${pub.length})</h2>
    ${pub.map(v => `<div class="vg" data-id="${esc(v.id)}"><div class="vg-line"><div><b>${esc(v.titulo)}</b> · ${esc(v.empresa)} · ${esc(v.local)}
      <div class="vg-meta" style="margin:4px 0 0">${v.inscricoesAte < hoje ? 'Prazo encerrado, já saiu do site' : 'No ar até ' + esc(v.inscricoesAte)} · <a href="../vagas/#${esc(v.id)}" target="_blank">ver no site</a></div></div>
      <button class="del" data-acao="apagar">tirar do ar</button></div></div>`).join('') || '<p class="note">Nenhuma ainda.</p>'}
    ${rec.length ? `<details style="margin-top:20px"><summary class="note" style="cursor:pointer">Recusadas (${rec.length})</summary>
      ${rec.map(v => `<div class="vg" data-id="${esc(v.id)}"><div class="vg-line"><div>${esc(v.titulo)} · ${esc(v.empresa)} <span class="note">${esc(v.email)}</span></div>
      <button class="del" data-acao="apagar">apagar</button></div></div>`).join('')}</details>` : ''}`;

  $('#av-s').onclick = () => {
    const email = $('#av').value.trim();
    $('#av-m').textContent = 'Salvando...';
    vpost({action:'aviso', senha, email, teste:true}).then(({ok, data}) => {
      if (!ok) return $('#av-m').textContent = data.error || 'Erro';
      AVISO = email; $('#av-m').textContent = email ? 'Salvo. Mandei um e-mail de teste.' : 'Salvo. Os avisos vão para o e-mail padrão.';
    });
  };
  $('#conteudo').onclick = e => {
    const b = e.target.closest('[data-acao]'); if (!b) return;
    const card = b.closest('[data-id]'), id = card.dataset.id, acao = b.dataset.acao;
    if (acao === 'apagar' && !confirm('Tirar esta vaga do site e apagar de vez?')) return;
    if (acao === 'recusar' && !confirm('Recusar esta vaga? Ela não vai aparecer no site.')) return;
    const vaga = {};
    card.querySelectorAll('[data-k]').forEach(i => vaga[i.dataset.k] = i.value.trim());
    if (vaga.tema) vaga.area = AREAS[vaga.tema];
    b.disabled = true;
    vpost({action:acao, senha, id, vaga}).then(({ok, data}) => {
      if (!ok){ b.disabled = false; return alert(data.error || 'Erro'); }
      carregar();
    });
  };
}

function painelRanking(mes){
  $('#conteudo').innerHTML = '<p class="note">Carregando...</p>';
  fetch('../api/cliques.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'ranking', senha, mes})})
    .then(r => r.json()).then(r => {
      const d = r.dados || {}, tot = d.total || {};
      const soma = x => (x.candidatar || 0) + (x.preparar || 0) + (x.video || 0) + (x.compartilhar || 0);
      const ordem = (a, b) => (b.candidatar || 0) - (a.candidatar || 0) || soma(b) - soma(a);
      const vagas = Object.entries(d.vagas || {}).map(([id, v]) => ({id, ...v})).sort(ordem);
      const emps = Object.entries(d.empresas || {}).map(([nome, v]) => ({nome, ...v})).sort(ordem);
      const nomeMes = m => { const [a, b] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][b - 1] + '/' + a; };
      const linha = (i, a, b, x) => `<tr><td class="m">${i + 1}º</td><td>${a}</td><td class="m">${b}</td><td><b>${x.candidatar || 0}</b></td><td>${x.preparar || 0}</td><td>${x.video || 0}</td><td>${x.compartilhar || 0}</td></tr>`;
      const cab = c => `<thead><tr><th></th><th>${c}</th><th></th><th>Candidatar</th><th>Como se preparar</th><th>Vídeos</th><th>Compartilhamentos</th></tr></thead>`;
      $('#conteudo').innerHTML = `
        <div class="bar" style="margin-top:20px"><select id="mes">${(r.meses.length ? r.meses : [r.mes]).map(m => `<option value="${m}"${m === r.mes ? ' selected' : ''}>${nomeMes(m)}</option>`).join('')}</select>
          <button class="btn" id="csv-r">Baixar planilha</button></div>
        <div class="kpis">
          <div class="kpi"><b>${tot.candidatar || 0}</b><span>Cliques em candidatar</span></div>
          <div class="kpi"><b>${tot.preparar || 0}</b><span>Aberturas de preparação</span></div>
          <div class="kpi"><b>${tot.video || 0}</b><span>Vídeos assistidos</span></div>
          <div class="kpi"><b>${tot.compartilhar || 0}</b><span>Compartilhamentos</span></div>
        </div>
        <h2 class="sec">Empresas mais procuradas</h2>
        <div class="tbl">${emps.length ? `<table>${cab('Empresa')}<tbody>${emps.slice(0, 20).map((e, i) => linha(i, esc(e.nome), '', e)).join('')}</tbody></table>` : '<p style="padding:20px;color:var(--muted)">Ainda sem cliques neste mês.</p>'}</div>
        <h2 class="sec">Vagas mais procuradas</h2>
        <div class="tbl">${vagas.length ? `<table>${cab('Vaga')}<tbody>${vagas.slice(0, 50).map((v, i) => linha(i, `<a href="../vagas/#${esc(v.id)}" target="_blank" style="color:var(--white)">${esc(v.titulo)}</a>`, esc(v.empresa), v)).join('')}</tbody></table>` : '<p style="padding:20px;color:var(--muted)">Ainda sem cliques neste mês.</p>'}</div>
        <p class="note">Mesma pessoa clicando várias vezes na mesma vaga no mesmo dia conta uma vez. Os números começam a contar a partir da publicação desta versão.</p>`;
      $('#mes').onchange = () => painelRanking($('#mes').value);
      $('#csv-r').onclick = () => {
        const linhas = [['tipo','nome','empresa','candidatar','preparar','video','compartilhar']].concat(
          emps.map(e => ['empresa', e.nome, '', e.candidatar || 0, e.preparar || 0, e.video || 0, e.compartilhar || 0]),
          vagas.map(v => ['vaga', v.titulo, v.empresa, v.candidatar || 0, v.preparar || 0, v.video || 0, v.compartilhar || 0]));
        const csv = '\ufeff' + linhas.map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
        a.download = 'ranking-vagas-' + r.mes + '.csv'; a.click();
      };
    }).catch(() => { $('#conteudo').innerHTML = '<p class="note">Não foi possível carregar o ranking.</p>'; });
}

// Cadastro de empresas que o robô de vagas acompanha (scripts/vagas/empresas.json)
function painelEmpresas(){
  $('#conteudo').innerHTML = '<p class="note">Carregando...</p>';
  Promise.all([fetch('../scripts/vagas/empresas.json', {cache:'no-cache'}).then(r => r.json()), fetch('../vagas/automaticas.json', {cache:'no-cache'}).then(r => r.json())])
    .then(([cad, auto]) => {
      const n = {}; auto.vagas.forEach(v => n[v.empresa] = (n[v.empresa] || 0) + 1);
      const LIDOS = ['pandape','workable','gupy','rmk','workday','oracle','radancy','inhire','solides','recruitee','brunel','airswift','atlas','mde','beehire'];
      const lista = cad.map(e => ({...e, lendo: !!(e.ats && !e.pausada && LIDOS.includes(e.ats.tipo)), vagas: n[e.nome] || 0, origens: (e.origem || []).join(', ')}));
      const origens = [...new Set(lista.flatMap(e => e.origem || []))].sort();
      $('#conteudo').innerHTML = `
        <div class="kpis" style="margin-top:20px">
          <div class="kpi"><b>${lista.length}</b><span>Empresas no cadastro</span></div>
          <div class="kpi"><b>${lista.filter(e => e.lendo).length}</b><span>Com vagas lidas pelo robô</span></div>
          <div class="kpi"><b>${lista.filter(e => e.vagas).length}</b><span>Com vaga aberta agora</span></div>
          <div class="kpi"><b>${auto.vagas.length}</b><span>Vagas no site</span></div>
        </div>
        <div class="bar"><input type="search" id="qe" placeholder="Buscar empresa">
          <select id="oe"><option value="">Todas as origens</option>${origens.map(o => `<option>${esc(o)}</option>`).join('')}</select>
          <select id="se"><option value="">Todas</option><option value="lendo">Robô lendo as vagas</option><option value="nao">Sem sistema de vagas</option><option value="conferir">Para conferir</option></select></div>
        <div class="tbl" id="te"></div>

// Stripe: chave, produtos à venda, faturas para empresas e pagamentos recebidos
function painelPagamentos(){
  $('#conteudo').innerHTML = '<p class="note">Carregando...</p>';
  const ppost = body => fetch('../api/pagamento.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({senha}, body))})
    .then(async r => ({ok:r.ok, data:await r.json().catch(() => ({}))}));
  const brl = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  const dt = d => d ? new Date(d).toLocaleDateString('pt-BR') : '';
  const SIT = {pago:'Pago', aguardando:'Aguardando', falhou:'Falhou', paid:'Paga', open:'Em aberto', void:'Cancelada', draft:'Rascunho', uncollectible:'Não paga'};
  ppost({action:'painel'}).then(({ok, data:d}) => {
    if (!ok) { $('#conteudo').innerHTML = `<p class="note">${esc(d.error || 'Não foi possível carregar.')}</p>`; return; }
    const P = d.pagamentos || [], F = d.faturas || [];
    const pagos = P.filter(p => p.situacao === 'pago');
    $('#conteudo').innerHTML = `<p class="sub" style="margin-top:16px">Pagamentos pela Stripe: produtos vendidos no site e faturas para empresas.</p>
      <div class="aviso">${d.configurada
        ? `<p><b style="color:var(--white)">Conectado à Stripe</b> · ${esc(d.conta || 'conta')} · modo <b style="color:${d.modo === 'teste' ? 'var(--gold-l)' : '#7fdc7f'}">${esc(d.modo)}</b> · chave final ${esc(d.final)} · ${d.webhook ? 'avisos de pagamento ligados' : '<span style="color:#ef7a7a">avisos de pagamento desligados, salve a chave de novo</span>'}</p>`
        : '<p>Cole a chave secreta da Stripe (começa com sk_ ou rk_). Ela fica guardada no servidor, fora do site.</p>'}
        <input type="password" id="pg-chave" placeholder="${d.configurada ? 'Trocar a chave (opcional)' : 'sk_test_... ou rk_test_...'}" autocomplete="off">
        <button class="btn" id="pg-salvar" type="button">Salvar chave</button><span class="note" id="pg-msg" style="margin:0"></span></div>
      ${d.configurada ? `
      <h2 class="sec">À venda no site</h2>
      <p class="note" style="margin:0 0 10px">Só os produtos marcados abrem o pagamento. Os outros mostram "ainda não está à venda".</p>
      <div class="bar">${Object.entries(d.produtos).map(([k, n]) => `<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" class="pg-ab" value="${esc(k)}" style="width:auto" ${(d.abertos || []).includes(k) ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
      <h2 class="sec">Nova fatura para empresa</h2>
      <div class="vg"><div class="g">
        <div><label>Cliente (empresa ou pessoa)</label><input id="ft-nome"></div>
        <div><label>E-mail de cobrança</label><input id="ft-email" type="email"></div>
        <div><label>CNPJ ou CPF (opcional)</label><input id="ft-doc"></div>
        <div><label>Valor (R$)</label><input id="ft-valor" inputmode="decimal" placeholder="1500,00"></div>
        <div><label>Descrição</label><input id="ft-desc" placeholder="Cobertura do evento X, anúncio no site em novembro..."></div>
        <div><label>Vence em (dias)</label><input id="ft-dias" type="number" value="7" min="1" max="60"></div></div>
        <div class="vg-acts"><button class="btn" id="ft-criar" type="button">Criar e enviar fatura</button><span class="note" id="ft-msg" style="margin:0"></span></div></div>
      <div class="kpis"><div class="kpi"><b>${pagos.length}</b><span>Pagamentos confirmados</span></div>
        <div class="kpi"><b>${brl(pagos.reduce((a, p) => a + p.valor, 0))}</b><span>Recebido pelo site</span></div>
        <div class="kpi"><b>${F.filter(f => f.situacao === 'open').length}</b><span>Faturas em aberto</span></div>
        <div class="kpi"><b>${brl(F.filter(f => f.situacao === 'open').reduce((a, f) => a + f.valor, 0))}</b><span>A receber</span></div></div>
      <h2 class="sec">Faturas</h2>
      <div class="tbl">${F.length ? `<table><thead><tr><th>Criada</th><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${F.map(f => `<tr>
        <td class="m">${dt(f.criada)}${f.vence ? `<br>vence ${dt(f.vence)}` : ''}</td>
        <td>${esc(f.cliente)}<br><span class="m">${esc(f.email)}</span></td><td class="m">${esc(f.descricao)}${f.numero ? `<br>${esc(f.numero)}` : ''}</td>
        <td>${brl(f.valor)}</td><td><span class="tag ${f.situacao === 'paid' ? 'sim' : 'nao'}">${esc(SIT[f.situacao] || f.situacao)}</span></td>
        <td>${f.link ? `<a href="${esc(f.link)}" target="_blank" style="color:var(--gold-l);font-size:12px">abrir</a>` : ''}${f.situacao === 'open' ? `<br><button class="del" data-void="${esc(f.id)}">cancelar</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p style="padding:24px;color:var(--muted)">Nenhuma fatura ainda.</p>'}</div>
      <h2 class="sec">Pagamentos do site</h2>
      <div class="tbl">${P.length ? `<table><thead><tr><th>Data</th><th>Cliente</th><th>O quê</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${P.map(p => `<tr>
        <td class="m">${dt(p.data)}${p.modo === 'teste' ? '<br>teste' : ''}</td><td>${esc(p.nome)}<br><a href="mailto:${esc(p.email)}" style="color:var(--gold-l)">${esc(p.email)}</a></td>
        <td>${esc(p.descricao)}</td><td>${brl(p.valor)}</td><td><span class="tag ${p.situacao === 'pago' ? 'sim' : 'nao'}">${esc(SIT[p.situacao] || p.situacao)}</span></td></tr>`).join('')}</tbody></table>` : '<p style="padding:24px;color:var(--muted)">Nenhum pagamento ainda.</p>'}</div>` : ''}`;
    $('#pg-salvar').onclick = () => {
      const chave = $('#pg-chave').value.trim(); if (!chave) return;
      $('#pg-msg').textContent = 'Conferindo com a Stripe...';
      ppost({action:'config', chave}).then(r => {
        if (!r.ok) { $('#pg-msg').textContent = r.data.error || 'Erro ao salvar'; return; }
        if (r.data.aviso) alert('Chave salva, mas o aviso de pagamento não foi criado: ' + r.data.aviso);
        painelPagamentos();
      });
    };
    document.querySelectorAll('.pg-ab').forEach(c => c.onchange = () =>
      ppost({action:'config', abertos:[...document.querySelectorAll('.pg-ab:checked')].map(x => x.value)}));
    if ($('#ft-criar')) $('#ft-criar').onclick = () => {
      const b = {action:'fatura', nome:$('#ft-nome').value, email:$('#ft-email').value, documento:$('#ft-doc').value, valor:$('#ft-valor').value, descricao:$('#ft-desc').value, dias:$('#ft-dias').value};
      $('#ft-msg').textContent = 'Criando...'; $('#ft-criar').disabled = true;
      ppost(b).then(r => {
        $('#ft-criar').disabled = false;
        if (!r.ok) { $('#ft-msg').textContent = r.data.error || 'Erro ao criar a fatura'; return; }
        try { navigator.clipboard.writeText(r.data.link); } catch (e) {}
        alert(`Fatura ${r.data.numero} criada${r.data.enviada ? ' e enviada por e-mail' : ''}. O link de pagamento foi copiado para você mandar no WhatsApp também.`);
        painelPagamentos();
      });
    };
    $('#conteudo').onclick = e => {
      const b = e.target.closest('[data-void]'); if (!b) return;
      if (!confirm('Cancelar esta fatura? O cliente não vai mais conseguir pagar por ela.')) return;
      ppost({action:'cancelar', id:b.dataset.void}).then(() => painelPagamentos());
    };
  }).catch(() => { $('#conteudo').innerHTML = '<p class="note">Não foi possível carregar.</p>'; });
}

// Currículo Sob Medida: chave da Anthropic, teste do gerador, revisão dos pedidos e lista de espera
let cvAberto = '';
function painelCurriculo(){
  $('#conteudo').innerHTML = '<p class="note">Carregando...</p>';
  const cj = body => fetch('../api/curriculo.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({senha}, body))})
    .then(async r => ({ok:r.ok, data:await r.json().catch(() => ({}))}));
  const SIT = {aguardando_pagamento:'Aguardando pagamento', na_fila:'Na fila', gerando:'Gerando...', revisar:'Para revisar', entregue:'Entregue', erro:'Erro', arquivado:'Arquivado'};
  const dt = d => d ? new Date(d).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '';
  cj({action:'pedidos'}).then(({ok, data:d}) => {
    if (!ok) { $('#conteudo').innerHTML = `<p class="note">${esc(d.error || 'Não foi possível carregar.')}</p>`; return; }
    const P = d.pedidos || [];
    window.cvCache = Object.fromEntries(P.filter(p => p.resultado).map(p => [p.id, p.resultado]));

    $('#conteudo').innerHTML = `<p class="sub" style="margin-top:16px">Gerador do Currículo Sob Medida. Todo currículo passa pela sua revisão antes de chegar ao cliente.</p>
      <div class="aviso">${d.configurada ? `<p><b style="color:var(--white)">Gerador ligado</b> · chave da Anthropic final ${esc(d.final)} · vendas ${d.aberto ? '<b style="color:#7fdc7f">abertas</b>' : 'fechadas (abra na aba Pagamentos)'}</p>`
        : '<p>Cole a chave da Anthropic (começa com sk-ant-). Ela fica guardada no servidor, fora do site.</p>'}
        <input type="password" id="cv-chave" placeholder="${d.configurada ? 'Trocar a chave (opcional)' : 'sk-ant-...'}" autocomplete="off">
        <button class="btn" id="cv-salvar" type="button">Salvar chave</button><span class="note" id="cv-msg" style="margin:0"></span></div>
      ${d.configurada ? `<h2 class="sec">Testar o gerador</h2>
      <form class="vg" id="cv-teste"><div class="g">
        <div><label>Nome da pessoa</label><input name="nome"></div>
        <div><label>Já embarcou?</label><select name="experiencia"><option value="nao">Ainda não</option><option value="sim">Sim</option></select></div>
        <div><label>Currículo atual (PDF ou Word .docx)</label><input type="file" name="cv" accept=".pdf,.docx" required></div>
        <div><label>PDF do LinkedIn (opcional)</label><input type="file" name="linkedin" accept=".pdf"></div></div>
        <label>Texto da vaga</label><textarea name="vaga" required placeholder="Cole o anúncio completo: atividades, requisitos, local..."></textarea>
        <div class="vg-acts"><button class="btn" type="submit">Gerar currículo</button><span class="note" id="cv-tmsg" style="margin:0">Leva de 1 a 3 minutos. Custa centavos de dólar.</span></div></form>` : ''}
      <h2 class="sec">Pedidos${ocupado ? ' <span class="note" style="font-weight:400">atualizando sozinho enquanto gera...</span>' : ''}</h2>
      ${P.length ? P.map(p => `<div class="vg ${p.situacao === 'revisar' ? 'pend' : ''}">
        <div class="vg-line"><div><b>${esc(p.nome)}</b> <span class="tag ${p.situacao === 'entregue' ? 'sim' : 'nao'}">${esc(SIT[p.situacao] || p.situacao)}</span>
          ${p.origem === 'painel' ? '<span class="tag nao">teste</span>' : ''}</div><span class="note" style="margin:0">${dt(p.data)}</span></div>
        <div class="vg-meta">${esc(p.email || '')}${p.whats ? ' · ' + esc(p.whats) : ''} · já embarcou: ${p.experiencia === 'sim' ? 'sim' : 'não'}${p.uso ? ` · ${p.uso.entrada + p.uso.saida} tokens` : ''}<br>
          <b>Vaga:</b> ${esc(String(p.vaga || '').slice(0, 220))}${String(p.vaga || '').length > 220 ? '...' : ''}
          ${p.erro ? `<br><span style="color:#ef7a7a">${esc(p.erro)}</span>` : ''}</div>
        <div class="vg-acts">
          ${p.resultado ? `<button class="btn" data-abrir="${esc(p.id)}" type="button">${cvAberto === p.id ? 'Fechar' : p.situacao === 'entregue' ? 'Ver' : 'Revisar'}</button>` : ''}
          ${(p.arquivos || {}).cv ? `<button class="btn ghost" data-arq="${esc(p.id)}" data-qual="cv" type="button">Currículo original</button>` : ''}
          ${p.resultado ? `<button class="btn ghost" data-arq="${esc(p.id)}" data-qual="docx" type="button">Word</button><button class="btn ghost" data-arq="${esc(p.id)}" data-qual="pdf" type="button">PDF</button>` : ''}
          ${p.situacao === 'erro' ? `<button class="btn" data-gerar="${esc(p.id)}" type="button">Tentar de novo</button>` : ''}
          ${p.situacao === 'entregue' ? `<a class="btn ghost" href="${esc(p.link)}" target="_blank">Página do cliente</a>` : ''}
          <button class="del" data-apagar="${esc(p.id)}" type="button">apagar</button></div>
        ${cvAberto === p.id && p.resultado ? editorCurriculo(p) : ''}</div>`).join('') : '<p class="note">Nenhum pedido ainda.</p>'}
      <div id="cv-lista"></div>`;
    painelListaEspera($('#cv-lista'));
    if (ocupado) setTimeout(() => { if (aba === 'curriculo') painelCurriculo(); }, 15000);

      const chave = $('#cv-chave').value.trim(); if (!chave) return;

      const b = e.target.closest('button'); if (!b || !b.dataset) return;
      if (b.dataset.abrir) { cvAberto = cvAberto === b.dataset.abrir ? '' : b.dataset.abrir; painelCurriculo(); }
      if (b.dataset.gerar) cj({action:'gerar', id:b.dataset.gerar}).then(() => setTimeout(painelCurriculo, 800));
      if (b.dataset.apagar && confirm('Apagar este pedido e os arquivos de vez?')) cj({action:'apagar', id:b.dataset.apagar}).then(painelCurriculo);
      if (b.dataset.arq) fetch('../api/curriculo.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'arquivo', senha, id:b.dataset.arq, qual:b.dataset.qual})})
        .then(r => r.ok ? r.blob() : Promise.reject()).then(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl);
          a.download = b.dataset.qual + '-' + b.dataset.arq + (b.dataset.qual === 'docx' ? '.docx' : '.pdf'); a.click(); }).catch(() => alert('Arquivo não encontrado'));
      if (b.dataset.salvar || b.dataset.aprovar || b.dataset.refazer) {
        const id = b.dataset.salvar || b.dataset.aprovar || b.dataset.refazer;
        if (b.dataset.refazer) {
          const nota = prompt('O que a nova versão deve mudar? (opcional)') ;
          if (nota === null) return;
          cj({action:'gerar', id, nota}).then(() => { cvAberto = ''; setTimeout(painelCurriculo, 800); }); return;
        }
        const r = lerEditor(id);
        cj({action:'salvar', id, resultado:r}).then(s => {
          if (!s.ok) { alert(s.data.error || 'Erro ao salvar'); return; }
          if (!b.dataset.aprovar) { alert('Revisão salva. Word e PDF atualizados.'); return; }
          if (!confirm('Aprovar e mandar o link de entrega para o cliente?')) return;
          cj({action:'aprovar', id}).then(a => { alert(a.ok ? (a.data.enviado ? 'Entregue. O cliente recebeu o e-mail.' : 'Entregue, mas o e-mail não saiu. Mande este link: ' + a.data.link) : (a.data.error || 'Erro')); cvAberto = ''; painelCurriculo(); });
        });
      }
    };
  }).catch(() => { $('#conteudo').innerHTML = '<p class="note">Não foi possível carregar.</p>'; });
}

// Editor da revisão: cada parte do currículo vira um campo. Listas ficam uma por linha.
function editorCurriculo(p){
  const r = p.resultado, id = p.id, L = a => esc((a || []).join('\n'));
  const campo = (k, rot, v, alto) => `<div style="margin-bottom:10px"><label>${rot}</label><textarea data-k="${k}" style="min-height:${alto || 70}px">${v}</textarea></div>`;
  const ent = (k, rot, v) => `<div><label>${rot}</label><input data-k="${k}" value="${esc(v)}"></div>`;
  return `<div id="ed-${esc(id)}" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
    ${(r.avisos_revisao || []).length ? `<div class="aviso" style="border-color:rgba(201,147,58,.45)"><p><b style="color:var(--gold-l)">Para conferir antes de aprovar:</b><br>${r.avisos_revisao.map(esc).join('<br>')}</p></div>` : ''}
    <p class="note" style="margin:0 0 12px">Nota antes ${esc(r.nota_antes)} → depois ${esc(r.nota_depois)}</p>
    <div class="g">${ent('dados.nome', 'Nome', r.dados.nome)}${ent('dados.cidade', 'Cidade', r.dados.cidade)}${ent('dados.telefone', 'Telefone', r.dados.telefone)}${ent('dados.email', 'E-mail', r.dados.email)}${ent('dados.linkedin', 'LinkedIn', r.dados.linkedin)}${ent('objetivo', 'Objetivo', r.objetivo)}</div>
    ${campo('resumo', 'Resumo profissional', esc(r.resumo), 120)}
    ${campo('idiomas', 'Idiomas (um por linha)', L(r.idiomas))}
    ${campo('formacao', 'Formação (um por linha)', L(r.formacao))}
    <label>Experiências</label>${(r.experiencias || []).map((e, i) => `<div class="vg" style="padding:12px;margin:6px 0"><div class="g">
      ${ent(`exp.${i}.periodo`, 'Período', e.periodo)}${ent(`exp.${i}.empresa`, 'Empresa', e.empresa)}${ent(`exp.${i}.local`, 'Local', e.local)}${ent(`exp.${i}.posicao`, 'Posição', e.posicao)}</div>
      ${campo(`exp.${i}.atividades`, 'Principais atividades', esc(e.atividades), 110)}</div>`).join('')}
    ${campo('qualificacoes', 'Qualificações (uma por linha)', L(r.qualificacoes), 110)}
    ${campo('outras', 'Outras informações (uma por linha)', L(r.outras))}
    ${campo('carta', 'Carta de apresentação', esc(r.carta), 140)}
    ${ent('linkedin.titulo', 'LinkedIn: título', r.linkedin.titulo)}
    ${campo('linkedin.sobre', 'LinkedIn: sobre', esc(r.linkedin.sobre), 120)}
    ${campo('linkedin.competencias', 'LinkedIn: competências (uma por linha)', L(r.linkedin.competencias))}
    ${campo('faltando', 'O que ainda falta para a vaga (um por linha)', L(r.faltando))}
    <div class="vg-acts"><button class="btn ghost" data-salvar="${esc(id)}" type="button">Salvar revisão</button>
      <button class="btn ghost" data-refazer="${esc(id)}" type="button">Gerar outra versão</button>
      <button class="btn" data-aprovar="${esc(id)}" type="button">${p.situacao === 'entregue' ? 'Salvar e reenviar' : 'Aprovar e entregar'}</button></div></div>`;
}
function lerEditor(id){
  const ed = document.getElementById('ed-' + id), v = k => (ed.querySelector(`[data-k="${k}"]`) || {}).value || '';
  const linhas = k => v(k).split('\n').map(x => x.trim()).filter(Boolean);
  const n = ed.querySelectorAll('[data-k$=".atividades"]').length;
  const antes = (window.cvCache || {})[id] || {};
  return {
    dados:{nome:v('dados.nome'), cidade:v('dados.cidade'), telefone:v('dados.telefone'), email:v('dados.email'), linkedin:v('dados.linkedin')},
    objetivo:v('objetivo'), resumo:v('resumo'), idiomas:linhas('idiomas'), formacao:linhas('formacao'),
    experiencias:[...Array(n).keys()].map(i => ({periodo:v(`exp.${i}.periodo`), empresa:v(`exp.${i}.empresa`), local:v(`exp.${i}.local`), posicao:v(`exp.${i}.posicao`), atividades:v(`exp.${i}.atividades`)})),
    qualificacoes:linhas('qualificacoes'), outras:linhas('outras'), carta:v('carta'),
    linkedin:{titulo:v('linkedin.titulo'), sobre:v('linkedin.sobre'), competencias:linhas('linkedin.competencias')},
    nota_antes:antes.nota_antes ?? null, nota_depois:antes.nota_depois ?? null, faltando:linhas('faltando'), avisos_revisao:antes.avisos_revisao || []
  };
}

function painelContatos(){
  const vagas = [...new Set(LEADS.map(l => l.vaga).filter(Boolean))];
  const semExp = LEADS.filter(l => l.experiencia === 'nao').length;
  const semana = LEADS.filter(l => Date.now() - new Date(l.data) < 7 * 864e5).length;
  $('#conteudo').innerHTML = `
    <p class="sub" style="margin-top:16px">Pessoas que preencheram o pop-up antes de se candidatar.</p>
    <div class="kpis">
      <div class="kpi"><b>${LEADS.length}</b><span>Contatos</span></div>
      <div class="kpi"><b>${semana}</b><span>Últimos 7 dias</span></div>
      <div class="kpi"><b>${semExp}</b><span>Sem experiência offshore</span></div>
      <div class="kpi"><b>${LEADS.length - semExp}</b><span>Com experiência</span></div>
    </div>
    <div class="bar">
      <input type="search" id="q" placeholder="Buscar nome, e-mail ou função">
      <select id="exp"><option value="">Com e sem experiência</option><option value="nao">Sem experiência offshore</option><option value="sim">Com experiência offshore</option></select>
      <select id="vg"><option value="">Todas as vagas</option>${vagas.map(v => `<option>${esc(v)}</option>`).join('')}</select>
      <button class="btn" id="csv">Baixar planilha</button>
    </div>
    <div class="tbl" id="tbl"></div>
    <p class="note">Se alguém pedir para ter os dados apagados (LGPD), clique em "remover" na linha da pessoa.</p>`;
  const filtrados = () => {
    const q = $('#q').value.toLowerCase(), ex = $('#exp').value, vg = $('#vg').value;
    return LEADS.filter(l => (!ex || l.experiencia === ex) && (!vg || l.vaga === vg) && (!q || (l.nome + ' ' + l.email + ' ' + l.funcao).toLowerCase().includes(q)));
  };
  const draw = () => {
    const r = filtrados();
    $('#tbl').innerHTML = r.length ? `<table><thead><tr><th>Data</th><th>Nome</th><th>E-mail</th><th>Função desejada</th><th>Offshore</th><th>Vaga</th><th></th></tr></thead><tbody>${
      r.map(l => `<tr><td class="m">${new Date(l.data).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'})}</td><td>${esc(l.nome)}</td>
        <td><a href="mailto:${esc(l.email)}" style="color:var(--gold-l)">${esc(l.email)}</a></td><td>${esc(l.funcao)}</td>
        <td><span class="tag ${l.experiencia}">${l.experiencia === 'sim' ? 'Tem experiência' : 'Sem experiência'}</span></td>
        <td class="m">${esc(l.vaga)}${l.empresa ? ' · ' + esc(l.empresa) : ''}</td>
        <td><button class="del" data-id="${esc(l.id)}">remover</button></td></tr>`).join('')}</tbody></table>`
      : '<p style="padding:24px;color:var(--muted)">Nenhum contato ainda.</p>';
  };
  $('#q').oninput = draw; $('#exp').onchange = draw; $('#vg').onchange = draw;
  $('#tbl').onclick = e => {
    const b = e.target.closest('.del'); if (!b) return;
    if (!confirm('Remover este contato de vez?')) return;
    post({action:'delete', senha, id:b.dataset.id}).then(() => carregar());
  };
  $('#csv').onclick = () => {
    const cols = ['data','nome','email','funcao','experiencia','vaga','empresa'];
    const csv = '﻿' + [cols.join(';')].concat(filtrados().map(l => cols.map(c => '"' + String(l[c] ?? '').replace(/"/g, '""') + '"').join(';'))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'contatos-vagas-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  };
  draw();
}

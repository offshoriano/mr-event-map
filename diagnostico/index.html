<script>
// O perfil de cada evento (mercados, público, preparação e contexto) fica em perfil.js
const PERFIL = window.PERFIL;

const MERCADOS = {perf:'Perfuração e poços', fpso:'FPSO e produção', subsea:'Subsea', gas:'GNL e gás natural', maritimo:'Apoio marítimo e estaleiros', manut:'Manutenção e inspeção', onshore:'Onshore e campos maduros', transicao:'Transição energética (eólica offshore, hidrogênio, CCUS)', decom:'Descomissionamento'};
const REGIOES = {br:'Brasil', gs:'Guiana e Suriname', am:'EUA e Américas', eu:'Europa e Mar do Norte', me:'Oriente Médio', as:'Ásia'};
const COMPRADORES = {op:'Operadoras', fpso:'Donas de FPSO', epc:'EPCistas e integradores', sonda:'Empresas de perfuração', serv:'Prestadoras de serviço', plsv:'Armadores de PLSV e apoio marítimo', estaleiro:'Estaleiros'};
// Viagem, hospedagem e ingresso por pessoa, em R$ mil. Referência para planejar, não cotação.
const CUSTO_VISITA = {br:[4,8], gs:[12,20], am:[20,35], eu:[25,40], me:[25,40], as:[30,45]};
const CUSTO_ESTANDE = {br:[40,120], gs:[60,150], am:[150,400], eu:[150,400], me:[150,400], as:[150,400]};

const PERGUNTAS = [
  {k:'mk', multi:true, t:'Em quais mercados sua empresa atua?', d:'Pode marcar mais de um.', ops:Object.entries(MERCADOS)},
  {k:'comp', multi:true, t:'Para quem você mais vende?', d:'Pode marcar mais de um.', ops:[['op','Operadoras','Petrobras, Shell, Equinor, Prio...'],['fpso','Donas de FPSO','SBM, Modec, BW Offshore, Yinson...'],['epc','EPCistas e integradores','Saipem, Seatrium, McDermott, Toyo...'],['sonda','Empresas de perfuração','Donas de sondas e navios-sonda: Transocean, Valaris, Constellation, Foresea...'],['serv','Prestadoras de serviço','Halliburton, SLB, Baker Hughes...'],['plsv','Armadores de PLSV e apoio marítimo','Subsea 7, TechnipFMC, OceanPact, DOF, Bram...'],['estaleiro','Estaleiros','Construção, conversão e reparo']]},
  {k:'reg', multi:true, t:'Onde você quer gerar negócio nos próximos 12 meses?', d:'Pode marcar mais de um.', ops:Object.entries(REGIOES).filter(([k]) => k !== 'as')},
  {k:'obj', multi:true, max:3, t:'O que você quer levar de um evento?', d:'Marque até 3.', ops:[['reuniao','Reunião com comprador','Sair com conversas de compra marcadas'],['marca','Marca e visibilidade','Ser lembrado pelo mercado'],['parceiro','Parceiro internacional','Representante, sócio ou distribuidor lá fora'],['lancar','Lançar produto ou serviço','Mostrar algo novo para muita gente'],['conhecer','Conhecer o mercado','Entender antes de investir pesado']]},
  {k:'modo', t:'Como você pretende participar?', d:'Pense no formato mais provável.', ops:[['visita','Visitando','Agenda de reuniões, sem estande'],['estande','Com estande','Espaço próprio ou em pavilhão'],['palestra','Palestrando','Conteúdo técnico ou painel'],['patrocinio','Patrocinando','Cota de patrocínio do evento']]},
  {k:'freq', t:'Quantos eventos cabem no seu ano, e com qual orçamento?', d:'Somando todos os eventos do ano.', ops:[['2','1 a 2 eventos'],['4','3 a 5 eventos'],['6','6 ou mais']],
    sub:{k:'orc', t:'Orçamento total para eventos', ops:[['50','Até R$ 50 mil'],['150','R$ 50 a 150 mil'],['400','R$ 150 a 400 mil'],['800','Acima de R$ 400 mil']]}},
];

const R = {mk:[], reg:[], comp:[], obj:[]};
let passo = -1;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track = (e, p) => { if (typeof gtag === 'function') gtag('event', e, p || {}); };

// ─── Eventos que ainda vão acontecer ────────────────────────────────────────
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function futuro(c){
  const hoje = new Date(), mi = MESES.indexOf(c.month);
  if (mi < 0) return c.year >= hoje.getFullYear();
  const ult = String(c.dates || '').match(/(\d+)\s*$/);
  const fim = new Date(c.year, mi, ult ? +ult[1] : 28, 23, 59);
  return fim >= hoje;
}
function eventos(){
  return (window.CONFERENCES || []).filter(c => PERFIL[c.id] && futuro(c)).map(c => ({...c, p:PERFIL[c.id]}));
}

// ─── Pontuação de 0 a 100 ───────────────────────────────────────────────────
function custo(e){
  const v = CUSTO_VISITA[e.p.reg], s = CUSTO_ESTANDE[e.p.reg];
  if (R.modo === 'estande' || R.modo === 'patrocinio') return [v[0] * 2 + s[0], v[1] * 3 + s[1]];
  if (R.modo === 'palestra') return [v[0] * 2, v[1] * 2];
  return [v[0] * 2, v[1] * 2];  // duas pessoas visitando
}
function pontuar(e){
  const p = e.p, por = [];
  const comuns = R.mk.filter(m => p.mk.includes(m));
  const foco = p.foco && R.mk.includes(p.foco);
  // Mercados (até 40): quanto do que você vende o evento cobre, e bônus quando ele é especialista num deles
  const mk = R.mk.length ? Math.min(40, comuns.length / R.mk.length * 28 + (foco ? 12 : 0)) : 20;
  if (foco) por.push('Evento especializado em ' + curto(p.foco));
  else if (comuns.length) por.push('Cobre ' + comuns.map(curto).join(', '));
  const reg = R.reg.includes(p.reg) ? 20 : (p.reg === 'am' && R.reg.includes('gs')) ? 6 : 0;
  if (reg === 20) por.push('Está na região onde você quer crescer');
  const compra = R.comp.filter(c => p.comp.includes(c));
  const comp = R.comp.length ? Math.round(compra.length / R.comp.length * 15) : 0;
  if (compra.length) por.push('Reúne ' + juntar(compra.map(c => lc(COMPRADORES[c]))) + ', ' + (compra.length > 1 ? 'que estão entre os seus compradores' : 'um dos seus compradores'));
  const porte = {3:10, 2:6, 1:3}[p.porte];
  const fora = p.reg !== 'br';
  const OBJ = {reuniao: foco ? 10 : ['summit','congresso'].includes(p.tipo) ? 8 : p.tipo === 'regional' ? 7 : 6,
               marca: p.porte === 3 ? 10 : p.porte === 2 ? 7 : 4,
               parceiro: fora ? 10 : 3,
               lancar: p.tipo === 'feira' ? (p.porte === 3 ? 10 : 8) : 4,
               conhecer: p.porte === 3 ? 10 : p.porte === 2 ? 7 : 5};
  // Com mais de um objetivo, vale a média deles
  const obj = R.obj.length ? R.obj.reduce((t, o) => t + (OBJ[o] ?? 5), 0) / R.obj.length : 5;
  // Orçamento (até 10): o custo mínimo do evento cabe na fatia de orçamento por evento?
  const porEvento = +R.orc / Math.max(1, +R.freq - (+R.freq > 2 ? 1 : 0));
  const c = custo(e);
  const orc = c[0] <= porEvento ? 10 : c[0] <= porEvento * 1.6 ? 5 : 0;
  if (orc < 5) por.push('Pesa no orçamento que você informou');
  let n = Math.round(mk + reg + comp + porte + obj + orc);
  // Sem nenhum mercado em comum o evento não passa de "baixa"
  if (R.mk.length && !comuns.length) n = Math.min(n, 40);
  return {n, por, c, comuns, compra};
}
const juntar = l => l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l[0] || '';
const faixa = n => n >= 70 ? 'alta' : n >= 45 ? 'media' : 'baixa';
const fmtC = c => `R$ ${c[0]} a ${c[1]} mil`;
const quando = e => /\d/.test(e.dates) ? `${e.dates} ${e.monthShort.toLowerCase()} ${e.year}` : MESES.includes(e.month) ? `${e.month.toLowerCase()} de ${e.year}, data a confirmar` : `${e.year}, data a confirmar`;
// "NRG Park, Houston, TX — EUA" vira cidade "Houston" e local "Houston, EUA"
const cidade = e => {
  const partes = e.location.split(' — ')[0].split(',').map(x => x.trim());
  const uf = partes.findIndex(x => /^[A-Z]{2}$/.test(x));
  return uf > 0 ? partes[uf - 1] : partes[partes.length - 1];
};
const onde = e => { const c = cidade(e), pais = e.location.split(' — ').pop(); return c === pais || !e.location.includes(' — ') ? c : `${c}, ${pais}`; };
// Minúscula só na primeira letra, preservando siglas (FPSO, LNG, PLSV)
// Nome curto do mercado, sem o que está entre parênteses
const curto = m => lc(MERCADOS[m]).replace(/ \(.*\)/, '');
const lc = t => /^[A-Z]{2,}/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1);

// ─── Como se preparar e posts para o LinkedIn ───────────────────────────────
function preparo(e){
  const p = e.p, dicas = (p.prep || []).map(t => ['Antes', t]);
  dicas.push(['Antes', {estande:'Para estande, feche o espaço com pelo menos 6 meses de antecedência. Os melhores lugares saem primeiro.',
    palestra:'Para palestrar, acompanhe a chamada de trabalhos, que costuma fechar de 6 a 9 meses antes.',
    patrocinio:'No patrocínio, negocie uma cota que inclua a lista de participantes e um espaço de fala.',
    visita:'Indo como visitante, marque as reuniões de 4 a 6 semanas antes. Na semana do evento as agendas já estão fechadas.'}[R.modo]]);
  const durante = {reuniao:'Monte a agenda em blocos de 30 minutos e deixe espaço para encontros que surgem no corredor.',
    marca:'Publique durante o evento: bastidores, conversas e o que você está aprendendo. Visibilidade se constrói em tempo real.',
    parceiro:'Visite os pavilhões de países e as rodadas de negócio. É ali que aparece o parceiro internacional.',
    lancar:'Faça a demonstração em horário fixo e avise antes nas redes e para a sua lista de clientes.',
    conhecer:'Assista às sessões técnicas e anote quem está comprando o quê. Esse mapa vale mais que o crachá.'};
  dicas.push(['Durante', durante[R.obj[0]] || durante.reuniao]);
  dicas.push(['Depois', 'Faça o follow-up em até 48 horas, com um próximo passo claro para cada conversa.']);
  return dicas;
}
// Nomes curtos para caber natural no texto dos posts
const MK_POST = {perf:'perfuração', fpso:'FPSO', subsea:'subsea', gas:'gás natural', maritimo:'apoio marítimo', manut:'manutenção e inspeção', onshore:'onshore', transicao:'transição energética', decom:'descomissionamento'};
const COMP_POST = {op:'operadoras', fpso:'donas de FPSO', epc:'EPCistas', sonda:'empresas de perfuração', serv:'prestadoras de serviço', plsv:'armadores', estaleiro:'estaleiros'};
function posts(top){
  if (!top.length) return [];
  const a = top[0], b = top[1], emp = R.empresa;
  const nome = e => e.name.split(' — ')[0].replace(/\s*\(.*?\)\s*$/, '').replace(/\s20\d\d$/, '');
  const mes = e => MESES.includes(e.month) ? e.month.toLowerCase() : 'breve';
  const naCidade = e => ({'Rio de Janeiro':'no Rio de Janeiro', 'Cidade do Panamá':'na Cidade do Panamá'})[cidade(e)] || 'em ' + cidade(e);
  const mA = a.p.foco && R.mk.includes(a.p.foco) ? a.p.foco : (a.s.comuns[0] || R.mk[0]);
  const vende = juntar(R.mk.slice(0, 3).map(m => MK_POST[m]));
  const compra = juntar(R.comp.slice(0, 3).map(c => COMP_POST[c]));
  const quer = {reuniao:'com a agenda aberta para conversar com', marca:'para mostrar o nosso trabalho e estreitar a relação com', parceiro:'para encontrar parceiros e conversar com',
    lancar:'para apresentar o que estamos lançando para', conhecer:'para ouvir e entender o que pensam'}[R.obj[0]] || 'para conversar com';
  // Visão de mercado: se o cliente quer crescer fora do Brasil e há evento lá no top 5, a história é essa região
  const fora = top.find(e => e.p.reg !== 'br' && R.reg.includes(e.p.reg) && window.VISAO_REG[e.p.reg]);
  const reg = fora ? fora.p.reg : (R.reg.find(r => window.VISAO_REG[r]) || 'br');
  const outro = fora && fora !== a ? fora : b;
  return [
    ['Antes do evento',
`Em ${mes(a)}, a ${emp} vai estar na ${nome(a)}, ${naCidade(a)}.

${a.p.imp}

${a.p.ctx}

Para quem trabalha com ${vende}, como a gente, estar lá é estar perto de quem decide os próximos projetos. Vamos ${quer} ${compra}.

Se você também vai, me chama aqui. Um café entre uma palestra e outra costuma render mais do que muita reunião marcada.`],
    ['Visão de mercado',
`${window.VISAO_REG[reg]}

${window.VISAO_MK[mA] || ''}

Na ${emp}, a gente acompanha esse movimento de perto. Por isso a nossa agenda dos próximos meses passa pela ${nome(a)}${outro ? ` e pela ${nome(outro)}` : ''}.

Quem constrói nesse mercado sabe que o contrato de amanhã nasce da conversa de hoje. Se esse também é o seu jogo, vamos conversar.`],
    ['Depois do evento',
`Voltamos da ${nome(a)} com a agenda cheia e algumas certezas.

[Conte aqui, com as suas palavras, a conversa ou a palestra que mais marcou você. Um nome, um número, uma frase ouvida no corredor.]

${a.p.ctx}

Obrigado a todo mundo que parou para conversar com a gente. Agora começa a parte que importa: transformar conversa em projeto.`],
  ];
}

// ─── Telas ──────────────────────────────────────────────────────────────────
function inicio(){
  const n = eventos().length;
  $('#app').innerHTML = `<div class="inicio">
    <div class="eyebrow">Diagnóstico de eventos · MR Group</div>
    <h1>Quais eventos valem<br><span>para a sua empresa?</span></h1>
    <p class="lead">Feira de óleo e gás custa caro, e muita empresa vai na que todo mundo vai, e não na que tem o comprador dela. Responda 6 perguntas e veja, entre os ${n} eventos que a gente acompanha no Brasil e no mundo, onde você tem mais chance de fechar negócio.</p>
    <ul>
      <li>Mapa de calor com a chance de negócio em cada evento</li>
      <li>Os 5 eventos que mais combinam com você, e o porquê</li>
      <li>Os que você pode pular sem medo</li>
      <li>Calendário sugerido dentro do seu orçamento</li>
      <li>Como se preparar para cada evento e posts prontos para o seu LinkedIn</li>
    </ul>
    <button class="btn" id="go">Começar, leva 2 minutos</button>
  </div>`;
  $('#go').onclick = () => { track('diag_inicio'); passo = 0; pergunta(); };
}

function pergunta(){
  const q = PERGUNTAS[passo], tot = PERGUNTAS.length + 1;
  const sel = (k, v) => Array.isArray(R[k]) ? R[k].includes(v) : R[k] === v;
  const ops = (k, lista) => `<div class="ops">${lista.map(([v, t, s]) => `<button type="button" class="op ${sel(k, v) ? 'on' : ''}" data-k="${k}" data-v="${v}">${esc(t)}${s ? `<small>${esc(s)}</small>` : ''}</button>`).join('')}</div>`;
  $('#app').innerHTML = `<div class="q">
    <div class="passo">Pergunta ${passo + 1} de ${tot}</div>
    <div class="prog"><i style="width:${(passo + 1) / tot * 100}%"></i></div>
    <h2>${esc(q.t)}</h2><p class="dica">${esc(q.d)}</p>
    ${ops(q.k, q.ops)}
    ${q.sub ? `<div class="sub-q"><h3>${esc(q.sub.t)}</h3>${ops(q.sub.k, q.sub.ops)}</div>` : ''}
    <div class="nav"><button class="btn ghost" id="voltar">Voltar</button><button class="btn" id="seguir">Continuar</button></div>
  </div>`;
  const pronto = () => (q.multi ? R[q.k].length : R[q.k]) && (!q.sub || R[q.sub.k]);
  const atual = () => { $('#seguir').disabled = !pronto(); };
  document.querySelectorAll('.op').forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (Array.isArray(R[k])) {
      if (!R[k].includes(v) && q.max && R[k].length >= q.max) return;
      R[k] = R[k].includes(v) ? R[k].filter(x => x !== v) : R[k].concat(v);
      b.classList.toggle('on');
    } else {
      R[k] = v;
      document.querySelectorAll(`.op[data-k="${k}"]`).forEach(x => x.classList.toggle('on', x === b));
      // Pergunta de escolha única sem subpergunta avança sozinha
      if (!q.multi && !q.sub) { setTimeout(() => { passo++; pergunta(); }, 180); return; }
    }
    atual();
  });
  $('#voltar').onclick = () => { passo--; passo < 0 ? inicio() : pergunta(); };
  $('#seguir').onclick = () => { passo++; passo < PERGUNTAS.length ? pergunta() : contato(); };
  atual();
  window.scrollTo(0, 0);
}

function contato(){
  const tot = PERGUNTAS.length + 1;
  $('#app').innerHTML = `<div class="q">
    <div class="passo">Última etapa</div>
    <div class="prog"><i style="width:100%"></i></div>
    <h2>Seu diagnóstico está quase pronto</h2>
    <p class="dica">Para quem vamos entregar? Seus dados ficam só com a MR Group.</p>
    <form id="f" class="campos" novalidate>
      <div><label for="nome">Seu nome</label><input id="nome" autocomplete="name" required></div>
      <div><label for="empresa">Empresa</label><input id="empresa" autocomplete="organization" required></div>
      <div><label for="cargo">Cargo</label><input id="cargo" autocomplete="organization-title"></div>
      <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
      <div><label for="whats">WhatsApp</label><input id="whats" type="tel" autocomplete="tel" placeholder="(22) 99999-9999"></div>
      <input id="site" name="site" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    </form>
    <p class="erro" id="erro"></p>
    <div class="nav"><button class="btn ghost" id="voltar">Voltar</button><button class="btn" id="ver">Ver meu diagnóstico</button></div>
    <p class="priv">Usamos estes dados para te enviar o diagnóstico e falar sobre eventos do setor. Você pode pedir para apagar a qualquer momento. <a href="/privacidade/" target="_blank" style="color:var(--gold-l)">Política de privacidade</a>.</p>
  </div>`;
  ['nome','empresa','cargo','email','whats'].forEach(k => { if (R[k]) $('#' + k).value = R[k]; });
  $('#voltar').onclick = () => { passo = PERGUNTAS.length - 1; pergunta(); };
  $('#ver').onclick = () => {
    ['nome','empresa','cargo','email','whats'].forEach(k => R[k] = $('#' + k).value.trim());
    if (!R.nome || !R.empresa || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(R.email)) { $('#erro').textContent = 'Preencha nome, empresa e um e-mail válido.'; return; }
    resultado(true);
  };
  window.scrollTo(0, 0);
}

function resultado(salvar){
  const lista = eventos().map(e => ({...e, s:pontuar(e)})).sort((a, b) => b.s.n - a.s.n);
  const top = lista.filter(e => e.s.n >= 45).slice(0, 5);
  const pular = lista.filter(e => faixa(e.s.n) === 'baixa' && e.p.porte >= 2).slice(-4).reverse();
  // Calendário: os melhores, em ordem de data, até caber no orçamento
  const cal = []; let soma = [0, 0];
  for (const e of lista) {
    if (cal.length >= +R.freq || e.s.n < 45) break;
    if (soma[0] + e.s.c[0] > +R.orc && cal.length) continue;
    cal.push(e); soma = [soma[0] + e.s.c[0], soma[1] + e.s.c[1]];
  }
  const ordemData = e => e.year * 100 + (MESES.indexOf(e.month) < 0 ? 12 : MESES.indexOf(e.month));
  cal.sort((a, b) => ordemData(a) - ordemData(b));
  const mapa = [...lista].sort((a, b) => ordemData(a) - ordemData(b));

  if (salvar) {
    track('diag_concluido', {comp:R.comp.join(','), obj:R.obj.join(','), modo:R.modo, orc:R.orc});
    const corpo = {action:'add', site:$('#site')?.value || '', nome:R.nome, empresa:R.empresa, cargo:R.cargo, email:R.email, whats:R.whats,
      respostas:{mercados:R.mk, compradores:R.comp, regioes:R.reg, objetivos:R.obj, participacao:R.modo, eventos_ano:R.freq, orcamento_mil:R.orc},
      top:top.map(e => `${e.name} (${e.s.n})`)};
    fetch('/api/diagnosticos.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo)}).catch(() => {});
  }

  const zap = 'https://wa.me/5522988335183?text=' + encodeURIComponent(`Oi, Matheus! Fiz o diagnóstico de eventos da ${R.empresa} no site e quero montar o plano de presença para ${top.slice(0, 3).map(e => e.name.split(' — ')[0]).join(', ')}.`);
  $('#app').innerHTML = `
    <div class="res-h">
      <div class="eyebrow">Diagnóstico de eventos · ${esc(R.empresa)}</div>
      <h1>Onde a ${esc(R.empresa)}<br><span>tem mais chance</span></h1>
      <p class="lead">${esc(R.nome.split(' ')[0])}, cruzamos o que você vende (${R.mk.map(curto).join(', ')}), para quem vende e onde quer crescer com os ${lista.length} eventos da nossa agenda.</p>
      <div class="legenda"><span><i style="background:var(--alta)"></i>Alta chance de negócio</span><span><i style="background:var(--media)"></i>Média</span><span><i style="background:var(--baixa)"></i>Baixa</span></div>
    </div>

    <h2 class="sec">Os ${top.length || ''} eventos que mais combinam com você</h2>
    ${top.length ? top.map((e, i) => `<div class="top ${faixa(e.s.n)}">
      <div class="cab"><div><b>${i + 1}. ${esc(e.name)}</b><div class="meta">${esc(quando(e))} · ${esc(onde(e))}</div></div>
      <div class="nota">${e.s.n}<small>de 100</small></div></div>
      <p class="nt">${esc(e.p.nota)}</p>
      <ul>${e.s.por.filter(x => !/^Pesa/.test(x)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      ${e.p.quem ? `<p class="quem"><b>Quem você encontra:</b> ${esc(e.p.quem)}</p>` : ''}
      <div class="prep"><b>Como se preparar</b>${preparo(e).map(([q, t]) => `<p><span>${q}</span>${esc(t)}</p>`).join('')}</div>
      <div class="custo">Investimento estimado (${R.modo === 'estande' || R.modo === 'patrocinio' ? 'estande e duas pessoas' : 'duas pessoas'}): ${fmtC(e.s.c)}</div>
    </div>`).join('') : '<p class="lead">Nenhum evento da agenda passou de 45 pontos com essas respostas. Vale ampliar as regiões ou os mercados.</p>'}

    <h2 class="sec">Mapa de calor da agenda</h2>
    <div class="mapa">${mapa.map(e => `<div class="ln ${faixa(e.s.n)}"><div class="d">${esc(/\d/.test(e.dates) ? e.dates + ' ' + e.monthShort.toLowerCase() : e.monthShort === '—' ? 'a confirmar' : e.monthShort.toLowerCase())} ${String(e.year).slice(2)}</div>
      <div>${esc(e.name)}<span class="loc">${esc(onde(e))}</span></div><div class="n">${e.s.n}</div></div>`).join('')}</div>

    ${pular.length ? `<h2 class="sec">Pode pular sem medo</h2>
    <div class="pular">${pular.map(e => `<div><b>${esc(e.name)}</b>. ${esc(!e.s.comuns.length ? 'Não cobre os mercados em que você atua.' : !R.reg.includes(e.p.reg) ? 'Fica fora das regiões onde você quer crescer.' : 'Os seus compradores não são o público forte desse evento.')}</div>`).join('')}</div>` : ''}

    ${cal.length ? `<h2 class="sec">Calendário sugerido</h2>
    <div class="cal"><ul>${cal.map(e => `<li>${esc(e.name)}<span>${esc(quando(e))}</span></li>`).join('')}</ul>
      <div class="tot">Investimento estimado no ano: R$ ${soma[0]} a ${soma[1]} mil, com orçamento informado de ${PERGUNTAS[5].sub.ops.find(o => o[0] === R.orc)[1].replace(/^Até/, 'até')}.</div></div>
    <p class="aviso">Faixas de referência para planejamento: passagem, hospedagem e credencial por pessoa${R.modo === 'estande' || R.modo === 'patrocinio' ? ', mais estande montado' : ''}. Patrocínio e palestra têm valores próprios de cada organizador.</p>` : ''}

    ${top.length ? `<h2 class="sec">Posts prontos para o seu LinkedIn</h2>
    <p class="aviso" style="margin:-4px 0 14px">Escritos com dados reais do mercado, no tom de quem vive o setor. Personalize com a sua experiência antes de publicar: é isso que faz o post render.</p>
    <div class="posts">${posts(top).map(([t, x], i) => `<div class="post"><div class="pt">${t}<button class="copiar" data-i="${i}">Copiar</button></div><p>${esc(x).replace(/\n/g, '<br>')}</p></div>`).join('')}</div>` : ''}

    <div class="cta"><h3>Quer ajuda para transformar isso em negócio?</h3>
      <p>A MR Group monta o plano de presença com você: agenda de reuniões com compradores, conteúdo antes e durante o evento e cobertura para as suas redes. Fala direto com o Matheus.</p>
      <a class="btn" href="${zap}" target="_blank" rel="noopener" id="zap">Falar com o Matheus no WhatsApp</a></div>
    <div class="acoes"><button class="btn ghost" onclick="window.print()">Salvar em PDF</button><button class="btn ghost" id="refazer">Refazer o diagnóstico</button></div>`;
  $('#zap').onclick = () => track('diag_whatsapp');
  const textos = posts(top);
  document.querySelectorAll('.copiar').forEach(b => b.onclick = () => {
    const t = textos[+b.dataset.i][1];
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'Copiado'; setTimeout(() => b.textContent = 'Copiar', 1800); })
      .catch(() => prompt('Copie o texto:', t));
    track('diag_post_copiado', {post: textos[+b.dataset.i][0]});
  });
  $('#refazer').onclick = () => { passo = 0; pergunta(); };
  window.scrollTo(0, 0);
}

inicio();
</script>
</body>
</html>

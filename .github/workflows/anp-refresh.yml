name: Atualizar Radar Offshore (dados ANP)

on:
  schedule:
    # Toda segunda-feira, 09:17 UTC (06:17 em Brasília)
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar dados nos painéis da ANP
        run: python3 scripts/anp/fetch.py

      - name: Salvar e publicar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anp/data
          if git diff --cached --quiet; then
            echo "Sem dados novos"
          else
            git commit -m "Radar Offshore: atualiza dados da ANP"
            git push origin HEAD:main
            # Push feito com GITHUB_TOKEN não dispara o deploy.yml, então repassa aqui
            git push origin HEAD:refs/heads/claude/event-map-platform-db2gk
          fi

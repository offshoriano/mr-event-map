name: Atualizar Radar Offshore (dados ANP)

on:
  schedule:
    # Toda segunda-feira, 09:17 UTC (06:17 em Brasília)
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar dados nos painéis da ANP
        run: python3 scripts/anp/fetch.py

      - name: Salvar dados novos no repositório
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anp/data
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Radar Offshore: atualiza dados da ANP"
            git push origin HEAD:main
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      # Push feito com GITHUB_TOKEN não dispara o deploy.yml, então publica aqui mesmo
      - name: Enviar para Hostinger via FTP
        if: steps.commit.outputs.mudou == 'sim'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

name: Publicar no Hostinger

# O Hostinger publica sozinho (integração GitHub do hPanel) a partir do ramo
# abaixo. Este workflow só repassa o main para esse ramo a cada atualização.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repassar main para o ramo que o Hostinger publica
        run: git push origin HEAD:refs/heads/claude/event-map-platform-db2gk
